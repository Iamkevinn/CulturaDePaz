let activaCausa = null;

/* ══════════════════════════════════════
   TAB SWITCHING
══════════════════════════════════════ */
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i===0&&id==='causas')||(i===1&&id==='etapas')));
  document.getElementById('tab-causas').classList.toggle('active', id==='causas');
  document.getElementById('tab-etapas').classList.toggle('active', id==='etapas');
}

/* ══════════════════════════════════════
   CAUSAS — RENDER
══════════════════════════════════════ */
function renderCausas() {
  const grid = document.getElementById('causas-grid');
  grid.innerHTML = CAUSAS.map((c, i) => `
    <div class="causa-card ${activaCausa===i?'active-card':''}" 
         style="${activaCausa===i?'border-color:'+c.color+';background:'+c.colorBg:''}"
         onclick="selectCausa(${i})">
      <span class="causa-icon">${c.icon}</span>
      <div class="causa-title">${c.label}</div>
    </div>
  `).join('');
}

function selectCausa(i) {
  activaCausa = i;
  renderCausas();
  renderCausaDetail(i);
}

function renderCausaDetail(i) {
  const c = CAUSAS[i];
  const ans = causaAnswered[i];
  const itemsHtml = c.items.map(it => `
    <div class="causa-item">
      <div class="causa-item-title">${it.t}</div>
      <div class="causa-item-text">${it.d}</div>
    </div>
  `).join('');

    <div class="quiz-box">
      <p>🤔 ${c.quiz.p}</p>
      <div class="quiz-opts">
        ${c.quiz.opts.map((o, j) => `
          <button class="quiz-opt ${ans!==undefined?(j===c.quiz.c?'correct':(j===ans&&ans!==c.quiz.c?'wrong':'')):''}${ans!==undefined?' disabled':''}" 
            ${ans!==undefined?'disabled':''} onclick="answerCausa(${i},${j})">${o}</button>
        `).join('')}
      </div>
      ${ans!==undefined?`<div class="quiz-feedback">${ans===c.quiz.c?'✓ '+c.quiz.fb:'✗ '+c.quiz.fb}</div>`:''}
    </div>`;
  document.getElementById('causa-detail').innerHTML = `
    <h3 style="color:${c.color}">${c.title}</h3>
    ${itemsHtml}
    ${quizHtml}
    <div class="fuentes">Fuentes: Informe Final Comisión de la Verdad, CNMH, Informe ¡Basta Ya!</div>
  `;
}

function answerCausa(causaIdx, optIdx) {
  if (causaAnswered[causaIdx] !== undefined) return;
  causaAnswered[causaIdx] = optIdx;
  renderCausaDetail(causaIdx);
}

/* ══════════════════════════════════════
   ETAPAS — RENDER
══════════════════════════════════════ */
function renderEtapasDots() {
  const wrap = document.getElementById('etapas-dots');
  wrap.innerHTML = ETAPAS.map((_, i) => `
    <div class="dot ${i===etapaActual?'active':''}" onclick="goEtapa(${i})"></div>
  `).join('');
}

function renderEtapa() {
  const e = ETAPAS[etapaActual];
  const ans = etapaAnswered[etapaActual];
  renderEtapasDots();
  document.getElementById('prev-btn').disabled = etapaActual === 0;
  document.getElementById('next-btn').disabled = etapaActual === ETAPAS.length - 1;
  document.getElementById('score-badge').textContent = `${etapaScore} / ${ETAPAS.length} correctas`;
  const total = ETAPAS.length;
  document.getElementById('progress-fill').style.width = (Object.keys(etapaAnswered).length / total * 100) + '%';

  const respHtml = `
    <div class="resp-grid">
      ${e.quiz.opts.map((o, j) => `
        <button class="resp-btn ${ans!==undefined?(j===e.quiz.c?'correct':(j===ans&&ans!==e.quiz.c?'wrong':'')):''}${ans!==undefined?' disabled':''}"
          ${ans!==undefined?'disabled':''} onclick="answerEtapa(${etapaActual},${j})">${o}</button>
      `).join('')}
    </div>
    <div class="etapa-feedback">${ans!==undefined?(ans===e.quiz.c?'✓ '+e.quiz.fb:'✗ '+e.quiz.fb):''}</div>
  `;
  document.getElementById('etapa-container').innerHTML = `
    <div class="etapa-card">
      <div class="etapa-header" style="background:${e.colorBg}">
        <span class="etapa-numero" style="background:${e.color}22;color:${e.color}">${e.num}</span>
        <div>
          <div class="periodo">${e.periodo}</div>
          <h2>${e.title}</h2>
        </div>
      </div>
      <div class="etapa-body">
        <ul class="char-list">
          ${e.chars.map(c => `<li>${c}</li>`).join('')}
        </ul>
        <div class="etapa-quiz">
          <div class="pregunta-label">Pregunta de comprensión</div>
          <div class="pregunta-text">${e.quiz.p}</div>
          ${respHtml}
        </div>
      </div>
    </div>
  `;
}

function answerEtapa(idx, optIdx) {
  if (etapaAnswered[idx] !== undefined) return;
  etapaAnswered[idx] = optIdx;
  if (optIdx === ETAPAS[idx].quiz.c) etapaScore++;
  renderEtapa();
}

function moveEtapa(dir) {
  const next = etapaActual + dir;
  if (next < 0 || next >= ETAPAS.length) return;
  etapaActual = next;
  renderEtapa();
}

function goEtapa(i) {
  etapaActual = i;
  renderEtapa();
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
renderCausas();
renderEtapa();
</script>
