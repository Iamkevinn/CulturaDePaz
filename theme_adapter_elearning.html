
<style>
.ta-textarea { width:100%; height:160px; padding:10px 12px; border-radius:8px; border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); font-family:monospace; font-size:12px; color:var(--color-text-primary); resize:vertical; line-height:1.65; box-sizing:border-box; }
.ta-textarea:focus { outline:none; border-color:var(--color-border-primary); }
.ta-btn-adapt { width:100%; padding:10px; border-radius:8px; border:none; font-size:14px; font-weight:500; cursor:pointer; transition:opacity .2s; }
.ta-btn-adapt:disabled { opacity:.4; cursor:not-allowed; }
.ta-preset { padding:4px 11px; border-radius:20px; font-size:12px; border:0.5px solid var(--color-border-secondary); background:var(--color-background-secondary); color:var(--color-text-secondary); cursor:pointer; transition:all .15s; }
.ta-preset:hover { border-color:var(--color-border-primary); color:var(--color-text-primary); }
.ta-swatch { width:18px; height:18px; border-radius:4px; border:0.5px solid rgba(0,0,0,.12); flex-shrink:0; }
.ta-copy { padding:3px 9px; font-size:11px; border-radius:4px; border:0.5px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-secondary); cursor:pointer; }
.ta-copy.ok { background:#2D7D5A; color:#fff; border-color:#2D7D5A; }
pre.ta-pre { background:var(--color-background-secondary); padding:10px 12px; border-radius:8px; font-size:11px; line-height:1.7; overflow:auto; color:var(--color-text-primary); margin:0; max-height:180px; border:0.5px solid var(--color-border-tertiary); box-sizing:border-box; }
</style>

<div id="root" style="padding:1.5rem 0; font-family:var(--font-sans);"></div>

<script type="module">
import { createElement as h, useState, useCallback } from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";

const DEF = {
  primary:'#1A6B8A', primaryLight:'#E4F3F8', primaryDark:'#0D4D66',
  accent:'#E07B39', accentLight:'#FDF0E6',
  success:'#2D7D5A', successLight:'#E6F5EE',
  danger:'#C03B3B', dangerLight:'#FCEAEA',
  bg:'#F5F9FA', cardBg:'#FFFFFF',
  text:'#1C2B33', textMuted:'#6B8998',
  border:'#D4E2E9', borderLight:'#EBF2F5',
};

const PRESETS = [
  { name:"🪖 Militar", v:`--primary: #77442C;\n--secondary: #B79867;\n--accent: #6A81A5;\n--dark: #2B211B;\n--light: #F2E7D5;\n--highlight: #947045;` },
  { name:"🔮 Púrpura", v:`--primary:#403060; --secondary:#504060; --accent:#D0A070; --bg:#F2E7D8; --text:#241B32;` },
  { name:"☮️ Paz dorada", v:`#E5B83A amarillo\n#243B8A azul profundo\n#D65C5C rojo coral\n#F4E8D4 marfil\n#2D2D2D gris oscuro` },
  { name:"📜 Pergamino", v:`--primary:#77442C; --secondary:#532D14; --accent:#B79867; --bronze:#947045; --cream:#E3CA9F; --blue:#6A81A5;` },
];

function toCssRoot(t) {
  return `:root {\n  --c-primary: ${t.primary};\n  --c-primary-light: ${t.primaryLight};\n  --c-primary-dark: ${t.primaryDark};\n  --c-accent: ${t.accent};\n  --c-accent-light: ${t.accentLight};\n  --c-success: ${t.success};\n  --c-success-light: ${t.successLight};\n  --c-danger: ${t.danger};\n  --c-danger-light: ${t.dangerLight};\n  --c-neutral-50: ${t.bg};\n  --c-neutral-100: ${t.borderLight};\n  --c-neutral-200: ${t.border};\n  --c-neutral-500: ${t.textMuted};\n  --c-neutral-700: ${t.textMuted};\n  --c-neutral-900: ${t.text};\n  --c-white: ${t.cardBg};\n}`;
}

function Preview({ t }) {
  const v = { '--p':t.primary,'--pl':t.primaryLight,'--pd':t.primaryDark,'--a':t.accent,'--al':t.accentLight,'--s':t.success,'--sl':t.successLight,'--d':t.danger,'--dl':t.dangerLight,'--bg':t.bg,'--cb':t.cardBg,'--tx':t.text,'--txm':t.textMuted,'--br':t.border,'--brl':t.borderLight };
  return h('div', { style:{ ...v, background:'var(--bg)', borderRadius:12, overflow:'hidden', border:'0.5px solid var(--br)' } },
    h('div', { style:{ background:'var(--p)', padding:'10px 16px', display:'flex', alignItems:'center', gap:10 } },
      h('div', { style:{ background:'rgba(255,255,255,.2)', padding:'3px 10px', borderRadius:20, fontSize:11, color:'#fff', fontWeight:600 } }, 'Módulo 1'),
      h('span', { style:{ color:'#fff', fontSize:13, fontWeight:500, flex:1 } }, 'Cultura de Paz y Seguridad Humana'),
      h('div', { style:{ width:80, height:5, background:'rgba(255,255,255,.25)', borderRadius:20, overflow:'hidden' } },
        h('div', { style:{ width:'25%', height:'100%', background:'var(--a)', borderRadius:20 } })
      )
    ),
    h('div', { style:{ background:'var(--cb)', borderBottom:'1px solid var(--br)', display:'flex', padding:'0 16px' } },
      ['📖 Lección','✏️ Quiz','🃏 Cards','🎯 Actividad'].map((tab,i) =>
        h('div', { key:i, style:{ padding:'10px 14px', fontSize:12, fontWeight:500, color:i===0?'var(--p)':'var(--txm)', borderBottom:i===0?'2.5px solid var(--p)':'2.5px solid transparent', whiteSpace:'nowrap' } }, tab)
      )
    ),
    h('div', { style:{ padding:14, display:'flex', flexDirection:'column', gap:10 } },
      h('div', { style:{ background:'var(--p)', borderRadius:12, padding:'16px 18px', color:'#fff', position:'relative', overflow:'hidden' } },
        h('div', { style:{ position:'absolute', right:-15, top:-15, width:80, height:80, borderRadius:'50%', background:'rgba(255,255,255,.08)' } }),
        h('div', { style:{ fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', opacity:.7, marginBottom:4 } }, 'Unidad 1 · Fundamentos'),
        h('div', { style:{ fontSize:15, fontWeight:600, marginBottom:8, lineHeight:1.3 } }, '¿Qué es la Cultura de Paz?'),
        h('div', { style:{ display:'flex', gap:14, fontSize:11, opacity:.85 } }, h('span',{},'📚 8 min'), h('span',{},'🎯 3 objetivos'))
      ),
      h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 } },
        h('div', { style:{ background:'var(--cb)', border:'0.5px solid var(--br)', borderRadius:10, padding:12 } },
          h('div', { style:{ display:'inline-block', fontSize:10, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--p)', background:'var(--pl)', padding:'2px 8px', borderRadius:20, marginBottom:7 } }, 'Concepto'),
          h('div', { style:{ fontSize:13, fontWeight:600, color:'var(--tx)', marginBottom:5 } }, 'Cultura de Paz'),
          h('div', { style:{ fontSize:11.5, color:'var(--txm)', lineHeight:1.5 } }, 'Valores y actitudes que rechazan la violencia y promueven el diálogo...')
        ),
        h('div', { style:{ background:'var(--cb)', border:'0.5px solid var(--br)', borderRadius:10, padding:12 } },
          h('div', { style:{ display:'inline-block', fontSize:10, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--a)', background:'var(--al)', padding:'2px 8px', borderRadius:20, marginBottom:7 } }, 'Principios'),
          h('div', { style:{ fontSize:13, fontWeight:600, color:'var(--tx)', marginBottom:6 } }, 'Los 8 pilares'),
          ['Educación para la paz','Derechos humanos','Igualdad de género'].map((p,i) =>
            h('div', { key:i, style:{ display:'flex', gap:5, alignItems:'center', fontSize:11, color:'var(--txm)', marginBottom:3 } },
              h('div', { style:{ width:15, height:15, borderRadius:'50%', background:'var(--p)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, flexShrink:0 } }, i+1),
              p
            )
          )
        )
      ),
      h('div', { style:{ background:'var(--cb)', border:'0.5px solid var(--br)', borderRadius:10, padding:12 } },
        h('div', { style:{ fontSize:10, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', color:'var(--p)', marginBottom:6 } }, 'Pregunta 1 de 5'),
        h('div', { style:{ fontSize:13, fontWeight:600, color:'var(--tx)', marginBottom:9 } }, '¿En qué año se adoptó la Declaración sobre una Cultura de Paz?'),
        h('div', { style:{ display:'flex', flexDirection:'column', gap:5 } },
          [['A','1995','wrong'],['B','1999','ok'],['C','2001','']].map(([opt,txt,st]) =>
            h('div', { key:opt, style:{ display:'flex', alignItems:'center', gap:8, padding:'7px 10px', border:`1.5px solid ${st==='ok'?'var(--s)':st==='wrong'?'var(--d)':'var(--br)'}`, background:st==='ok'?'var(--sl)':st==='wrong'?'var(--dl)':'var(--bg)', borderRadius:7, fontSize:12, color:st==='ok'?'var(--s)':st==='wrong'?'var(--d)':'var(--txm)' } },
              h('div', { style:{ width:20, height:20, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:700, flexShrink:0, background:st==='ok'?'var(--s)':st==='wrong'?'var(--d)':'var(--brl)', color:st?'#fff':'var(--txm)' } }, opt),
              txt
            )
          )
        )
      ),
      h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 } },
        h('div', { style:{ background:'var(--p)', borderRadius:10, padding:14, color:'#fff', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:72 } },
          h('div', { style:{ fontSize:10, opacity:.7, textTransform:'uppercase', letterSpacing:'.1em', marginBottom:5 } }, 'Término'),
          h('div', { style:{ fontSize:14, fontWeight:600, textAlign:'center' } }, 'Seguridad Humana'),
          h('div', { style:{ fontSize:10, opacity:.45, marginTop:6 } }, 'clic para definición')
        ),
        h('div', { style:{ display:'flex', flexDirection:'column', gap:5 } },
          h('div', { style:{ background:'var(--p)', color:'#fff', padding:'7px 10px', borderRadius:7, fontSize:12, fontWeight:500 } }, 'Vacunas y salud'),
          h('div', { style:{ border:'2px dashed var(--br)', padding:'7px 10px', borderRadius:7, fontSize:11, color:'var(--txm)' } }, '💊 Sanitaria — suelta aquí…'),
          h('div', { style:{ border:`2px solid var(--s)`, background:'var(--sl)', padding:'7px 10px', borderRadius:7, fontSize:11, color:'var(--s)', fontWeight:500 } }, '✓ 🌾 Alimentaria')
        )
      ),
      h('div', { style:{ display:'flex', gap:8, paddingTop:4 } },
        h('button', { style:{ background:'var(--p)', color:'#fff', border:'none', padding:'8px 16px', borderRadius:7, fontSize:13, fontWeight:600, cursor:'pointer' } }, 'Ir al Quiz →'),
        h('button', { style:{ background:'none', color:'var(--txm)', border:'1px solid var(--br)', padding:'7px 14px', borderRadius:7, fontSize:13, cursor:'pointer' } }, '← Anterior'),
        h('div', { style:{ marginLeft:'auto', background:'var(--a)', color:'#fff', padding:'8px 14px', borderRadius:7, fontSize:13, fontWeight:600 } }, 'Verificar ✓')
      )
    )
  );
}

function App() {
  const [input, setInput] = useState('');
  const [theme, setTheme] = useState(DEF);
  const [loading, setLoading] = useState(false);
  const [css, setCss] = useState('');
  const [copied, setCopied] = useState(false);
  const [err, setErr] = useState('');

  const adapt = useCallback(async () => {
    if (!input.trim()) return;
    setLoading(true); setErr('');
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:800,
          messages:[{ role:"user", content:`Eres experto en diseño UI y teoría del color. Analiza esta paleta y mapéala a un sistema de diseño para e-learning educativo.

Paleta:
${input}

Devuelve SOLO JSON válido, sin markdown ni explicaciones:
{"primary":"#hex","primaryLight":"#hex","primaryDark":"#hex","accent":"#hex","accentLight":"#hex","success":"#hex","successLight":"#hex","danger":"#hex","dangerLight":"#hex","bg":"#hex","cardBg":"#hex","text":"#hex","textMuted":"#hex","border":"#hex","borderLight":"#hex"}

Reglas:
- primary: color institucional/predominante
- primaryLight: mezcla con ~88% blanco — muy claro, mismo matiz que primary
- primaryDark: versión oscura del primary para hover
- accent: el color más energético/cálido para CTAs
- accentLight: versión muy suave del acento (~90% blanco)
- success/danger: verde y rojo que armonicen con la paleta, pero reconocibles
- successLight/dangerLight: versiones con ~90% blanco
- bg: el color de fondo de página (más claro o derivado)
- cardBg: blanco puro o casi blanco para tarjetas
- text: oscuro para texto principal, buen contraste con bg
- textMuted: intermedio para texto secundario
- border: borde suave, derivado del text o neutral
- borderLight: borde muy sutil, casi transparente` }]
        })
      });
      const data = await res.json();
      const raw = data.content?.find(b=>b.type==='text')?.text || '{}';
      const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
      setTheme(parsed);
      setCss(toCssRoot(parsed));
    } catch(e) { setErr('No se pudo procesar. Verifica el formato e intenta de nuevo.'); }
    finally { setLoading(false); }
  }, [input]);

  const copy = () => { navigator.clipboard.writeText(css); setCopied(true); setTimeout(()=>setCopied(false),2200); };

  const swatchKeys = [['primary','Primary'],['accent','Accent'],['success','Success'],['danger','Danger'],['bg','Fondo'],['cardBg','Card'],['text','Texto'],['textMuted','Muted']];

  return h('div', { style:{ fontFamily:'var(--font-sans)' } },
    h('div', { style:{ marginBottom:16 } },
      h('h2', { style:{ fontSize:18, fontWeight:500, margin:'0 0 4px' } }, 'Adaptador de Tema IA'),
      h('p', { style:{ fontSize:14, color:'var(--color-text-secondary)', margin:0 } }, 'Pega tu paleta en cualquier formato — la IA la mapea a tu plantilla de curso al instante.')
    ),
    h('div', { style:{ display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center' } },
      h('span', { style:{ fontSize:12, color:'var(--color-text-secondary)' } }, 'Ejemplos:'),
      ...PRESETS.map(p => h('button', { key:p.name, className:'ta-preset', onClick:()=>setInput(p.v) }, p.name))
    ),
    h('div', { style:{ display:'grid', gridTemplateColumns:'300px 1fr', gap:18, alignItems:'start' } },
      h('div', { style:{ display:'flex', flexDirection:'column', gap:10 } },
        h('textarea', { className:'ta-textarea', value:input, onChange:e=>setInput(e.target.value), placeholder:`:root {\n  --primary: #77442C;\n  --accent: #6A81A5;\n  --light: #F2E7D5;\n}\n\no cualquier formato de paleta...` }),
        h('button', { className:'ta-btn-adapt', disabled:loading||!input.trim(), onClick:adapt, style:{ background:loading||!input.trim()?'var(--color-background-secondary)':'#1A6B8A', color:loading||!input.trim()?'var(--color-text-secondary)':'#fff' } },
          loading ? '⏳ Adaptando con IA…' : '✨ Adaptar con IA'
        ),
        err && h('p', { style:{ fontSize:12, color:'var(--color-text-danger)', margin:0 } }, err),
        css && h('div', { style:{ display:'flex', flexDirection:'column', gap:10 } },
          h('div', { style:{ fontSize:11, fontWeight:500, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--color-text-secondary)' } }, 'Paleta generada'),
          h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 } },
            ...swatchKeys.map(([k,label]) => h('div', { key:k, style:{ display:'flex', alignItems:'center', gap:6 } },
              h('div', { className:'ta-swatch', style:{ background:theme[k] } }),
              h('span', { style:{ fontSize:11, color:'var(--color-text-secondary)' } }, label)
            ))
          ),
          h('div', {},
            h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 } },
              h('span', { style:{ fontSize:11, fontWeight:500, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--color-text-secondary)' } }, 'CSS para tu archivo'),
              h('button', { className:`ta-copy${copied?' ok':''}`, onClick:copy }, copied ? '✓ Copiado' : 'Copiar')
            ),
            h('pre', { className:'ta-pre' }, css)
          )
        )
      ),
      h('div', {},
        h('div', { style:{ fontSize:11, fontWeight:500, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--color-text-secondary)', marginBottom:8 } }, 'Vista previa del curso'),
        h(Preview, { t:theme })
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
